####################################################################################
# Multi-arch release pipeline.
#
# This workflow is an orchestrator. The build matrix lives in ci.yaml, which in
# turn fans out to build.yaml, so a release ships exactly what every pull
# request already builds and tests -- no second, drifting copy of the matrix.
#
# Publishes, for each of the four targets:
#   * an archive of the CMake install tree (headers, shared + static libraries,
#     keyltConfig.cmake) that a consumer can point CMAKE_PREFIX_PATH at
#   * a SHA256SUMS covering all of them
#   * a rendered vcpkg overlay port pinned to the tag being released
####################################################################################
name: Release

on:
  push:
    tags:
      - "v*.*.*"
  # Lets you smoke-test the build + packaging path without cutting a tag.
  # The `release` job self-skips unless the ref is a version tag.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          # The tag is the source of truth, so nobody has to bump CMakeLists.txt
          # before tagging. Untagged dispatch runs fall back to the manifest.
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(sed -n 's/^set(KEYLT_VERSION "\([^"]*\)".*/\1/p' CMakeLists.txt)"
          fi
          if [ -z "${version}" ]; then
            echo "::error::Could not resolve a version to release."
            exit 1
          fi
          printf 'version=%s\n' "${version}" >> "$GITHUB_OUTPUT"
          echo "Releasing version ${version}"

  build:
    name: CI
    needs: [prepare]
    uses: ./.github/workflows/ci.yaml
    with:
      version: ${{ needs.prepare.outputs.version }}

  release:
    name: Release
    needs: [prepare, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Collect checksums
        run: |
          set -euo pipefail
          cd dist
          cat ./*.sha256 | sort -k 2 > SHA256SUMS
          rm -f ./*.sha256
          cat SHA256SUMS

      # Pins the overlay port to the tag being published, so consumers can run
      # `vcpkg install keylt --overlay-ports=<extracted>` with no edits.
      - name: Render vcpkg overlay port
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail

          # vcpkg_from_github fetches this exact URL, so hashing it here gives
          # the SHA512 the portfile has to declare.
          tarball="https://github.com/${GITHUB_REPOSITORY}/archive/${GITHUB_REF_NAME}.tar.gz"
          sha512="$(curl -fsSL "${tarball}" | sha512sum | cut -d' ' -f1)"

          mkdir -p port/keylt
          sed -e "s|\"version\": \"[^\"]*\"|\"version\": \"${VERSION}\"|" \
              ports/keylt/vcpkg.json > port/keylt/vcpkg.json
          sed -e "s|@REPO@|${GITHUB_REPOSITORY}|g" \
              -e "s|@REF@|${GITHUB_REF_NAME}|g" \
              -e "s|@SHA512@|${sha512}|g" \
              ports/keylt/portfile.cmake > port/keylt/portfile.cmake

          if grep -q '@REPO@\|@REF@\|@SHA512@' port/keylt/portfile.cmake; then
            echo "::error::The rendered overlay port still contains placeholders."
            exit 1
          fi

          tar czf dist/keylt-vcpkg-port.tar.gz -C port keylt
          (cd dist && sha256sum keylt-vcpkg-port.tar.gz >> SHA256SUMS)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          # A SemVer pre-release identifier is anything after a hyphen, so
          # v1.0.1-rc.7 must not be published as the latest stable release:
          # without this it takes over the repository's "Latest" badge and is
          # what `gh release download` picks by default.
          prerelease: ${{ contains(needs.prepare.outputs.version, '-') }}
          files: |
            dist/*

  # Publishes the Rust crates to crates.io. Runs in parallel with the GitHub
  # Release job so that neither blocks the other. The workspace Cargo.toml
  # carries a dev placeholder version; this job stamps it from the tag before
  # publishing.
  #
  # keylt-sys must be published before keylt (dependency ordering), with a
  # short sleep for the crates.io index to propagate.
  publish-crates:
    name: Publish Rust crates
    needs: [prepare, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Stamp crate version from tag
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          sed -i "s/^version = \".*\"/version = \"${VERSION}\"/" rust/Cargo.toml
          sed -i "s/keylt-sys = { path = \"keylt-sys\", version = \".*\" }/keylt-sys = { path = \"keylt-sys\", version = \"${VERSION}\" }/" rust/Cargo.toml
          echo "::group::rust/Cargo.toml"
          cat rust/Cargo.toml
          echo "::endgroup::"

      # The build job already tested the crates against the staged C library.
      # --no-verify is required here because keylt-sys's `include` list strips
      # the C source tree, so a verification build would fail trying to compile
      # it from scratch. The CI matrix has already proven correctness.
      - name: Download Linux x86_64 artifact
        uses: actions/download-artifact@v4
        with:
          name: keylt-x86_64-linux-gnu
          path: staging

      - name: Extract staging prefix
        run: |
          set -euo pipefail
          mkdir -p /tmp/keylt-prefix
          tar xzf staging/keylt-x86_64-linux-gnu.tar.gz -C /tmp/keylt-prefix

      - name: Publish keylt-sys
        working-directory: rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          KEYLT_LIB_DIR: /tmp/keylt-prefix/lib
          KEYLT_INCLUDE_DIR: /tmp/keylt-prefix/include
        run: cargo publish -p keylt-sys --no-verify

      - name: Wait for crates.io index
        run: sleep 30

      - name: Publish keylt
        working-directory: rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          KEYLT_LIB_DIR: /tmp/keylt-prefix/lib
          KEYLT_INCLUDE_DIR: /tmp/keylt-prefix/include
        run: cargo publish -p keylt --no-verify
