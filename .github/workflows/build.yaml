####################################################################################
# Single-target build, test and packaging (reusable).
#
# Builds the keylt library for exactly one platform/architecture, proves the
# installed package is consumable by a downstream project, and uploads it as an
# archive plus a sha256 sidecar.
#
# ci.yaml fans this workflow out over the target matrix; nothing here is aware
# of the matrix as a whole.
####################################################################################
name: Build (reusable)

on:
  workflow_call:
    inputs:
      target:
        description: "Target identifier, used for the artifact and archive names"
        type: string
        required: true
      os:
        description: "GitHub Actions runner image to build on"
        type: string
        required: true
      triplet:
        description: "vcpkg triplet to resolve dependencies for"
        type: string
        required: true
      msvc_arch:
        description: "Architecture passed to msvc-dev-cmd; empty on non-Windows runners"
        type: string
        default: ""
      version:
        description: "Version to stamp onto the library. Empty keeps the CMakeLists.txt default."
        type: string
        default: ""

permissions:
  contents: read

# A caller's `defaults` do not propagate into a reusable workflow, so it has to
# declare its own.
defaults:
  run:
    shell: bash

jobs:
  build:
    name: ${{ inputs.target }}
    runs-on: ${{ inputs.os }}
    env:
      VCPKG_TARGET_TRIPLET: ${{ inputs.triplet }}
      # gtest, hidapi and libusb are all compiled from source and dominate the
      # wall clock, so keep vcpkg's built packages in the Actions cache.
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # vcpkg's x-gha binary cache provider reads these two, but they are only
      # exposed to JavaScript actions, never to `run:` steps.
      - name: Export GitHub Actions cache credentials
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      # $PWD under Git Bash is an MSYS path (/d/a/...) that CMake cannot resolve,
      # so every absolute path below goes through $WS instead.
      - name: Resolve workspace path
        run: |
          set -euo pipefail
          if [ "${RUNNER_OS}" = "Windows" ]; then
            echo "WS=$(pwd -W)" >> "$GITHUB_ENV"
          else
            echo "WS=${PWD}" >> "$GITHUB_ENV"
          fi

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          # libudev and libusb are the system pieces vcpkg's hidapi port builds against.
          sudo apt-get install -y pkg-config libudev-dev libusb-1.0-0-dev autoconf automake libtool

      # vcpkg ships prebuilt helper tools for x64 only, so on arm64 it has to
      # fall back to whatever the runner image already provides.
      - name: Force vcpkg to use system binaries on arm64 Linux
        if: runner.os == 'Linux' && runner.arch == 'ARM64'
        run: echo "VCPKG_FORCE_SYSTEM_BINARIES=1" >> "$GITHUB_ENV"

      # The `ci` preset generates for Ninja, which expects the MSVC environment
      # to already be on PATH rather than discovering it itself.
      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ inputs.msvc_arch }}

      - name: Bootstrap vcpkg
        run: |
          set -euo pipefail
          if [ "${RUNNER_OS}" = "Windows" ]; then
            ./vcpkg/bootstrap-vcpkg.bat -disableMetrics
          else
            ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
          fi
          echo "VCPKG_ROOT=${WS}/vcpkg" >> "$GITHUB_ENV"

      - name: Configure
        env:
          KEYLT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # Passed on the command line rather than read from the environment by
          # the preset: an unset variable would otherwise expand to an empty
          # cache entry and vcpkg would reject it as an invalid triplet.
          extra=("-DVCPKG_TARGET_TRIPLET=${VCPKG_TARGET_TRIPLET}")
          if [ -n "${KEYLT_VERSION}" ]; then
            extra+=("-DKEYLT_VERSION=${KEYLT_VERSION}")
          fi
          cmake --preset ci "${extra[@]}"

      - name: Build
        run: cmake --build --preset ci

      # Hardware-dependent cases self-skip unless KEYBOARD_ATTACHED=1, so this
      # is safe on a runner with no keyboard plugged in.
      - name: Test
        run: ctest --preset ci

      - name: Install
        run: cmake --install build/ci --prefix "${WS}/stage"

      # keylt.h promises that the shared library exports a pure C ABI. Nothing
      # in the compiler enforces that: a stray missing visibility attribute, or
      # a dependency linked without --exclude-libs, silently widens the surface.
      - name: Verify only the C ABI is exported
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          so="$(ls "${WS}"/build/ci/libkeylt.so.*.*.*)"
          exported="$(nm -D --defined-only "${so}" | awk '$2 == "T" {print $3}')"
          echo "${exported}"
          if [ -z "${exported}" ]; then
            echo "::error::libkeylt.so exports nothing"
            exit 1
          fi
          if unexpected="$(printf '%s\n' "${exported}" | grep -v '^keylt_')"; then
            echo "::error::non-keylt_ symbols are exported:"
            printf '%s\n' "${unexpected}"
            exit 1
          fi

      # The real proof that the exported package is usable: configure a separate
      # project that knows nothing but `find_package(keylt CONFIG)`. It builds
      # both a C++ and a C99 consumer, the latter being what proves the header
      # is callable from outside C++.
      - name: Verify the package is consumable downstream
        run: |
          set -euo pipefail
          cmake -S test/consumer -B build/consumer -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${WS}/stage;${WS}/build/ci/vcpkg_installed/${VCPKG_TARGET_TRIPLET}"
          cmake --build build/consumer
          ctest --test-dir build/consumer --output-on-failure

      # The Rust crates in rust/ are the other foreign-language consumer, and
      # the one that exercises the header through bindgen rather than a C
      # compiler. Only the x86_64 legs run them: the ARM legs would prove the
      # same thing about the same header for a much longer wall clock.
      - name: Install the Rust toolchain
        if: inputs.target == 'x86_64-linux-gnu' || inputs.target == 'x86_64-windows-msvc'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Linked against the tree staged above rather than rebuilt from source, so
      # this tests the same artefacts the release archives ship.
      #
      # The shared library is what gets linked, deliberately. It encapsulates
      # hidapi behind --exclude-libs, so nothing here has to restate keylt's
      # private dependency graph; the static archive exposes hidapi as a public
      # usage requirement, and vcpkg's hidapi-libusb.pc declares no private
      # deps of its own, so a static link would have to guess at libusb and
      # libudev too. That is precisely what the shared library exists to avoid.
      - name: Build and test the Rust crates
        if: inputs.target == 'x86_64-linux-gnu' || inputs.target == 'x86_64-windows-msvc'
        working-directory: rust
        env:
          KEYLT_LIB_DIR: ${{ env.WS }}/stage/lib
          KEYLT_INCLUDE_DIR: ${{ env.WS }}/stage/include
          CARGO_TERM_COLOR: always
        run: |
          set -euo pipefail

          if [ "${RUNNER_OS}" = "Windows" ]; then
            # Git for Windows ships a coreutils link.exe in /usr/bin. Under the
            # bash shell this workflow defaults to it shadows MSVC's linker, and
            # rustc invokes `link.exe` by bare name, so it picks up the wrong one
            # and dies with "extra operand". CMake is immune: it resolves the
            # linker to an absolute path at configure time.
            export PATH="$(dirname "$(command -v cl.exe)"):${PATH}"
            # keylt.dll has to be findable when the test binaries run. $WS is a
            # Windows path (D:/a/...), and its drive-letter colon would be read
            # as a PATH separator, so convert to the POSIX form bash expects.
            export PATH="$(cygpath -u "${WS}/stage/bin"):${PATH}"
            ls -l "$(cygpath -u "${WS}/stage/bin")"
          else
            export LD_LIBRARY_PATH="${WS}/stage/lib${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"
          fi

          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --no-default-features -- -D warnings
          cargo test --workspace --no-default-features
          cargo build --workspace --examples --no-default-features

      # keylt-sys ships hand-written declarations so that building it needs no
      # libclang. This re-derives them from keylt.h and runs the same suite
      # against the result: a signature or layout that has drifted fails to
      # compile or trips the assertions in keylt-sys/tests/abi.rs.
      - name: Check the checked-in bindings against keylt.h
        if: inputs.target == 'x86_64-linux-gnu'
        working-directory: rust
        env:
          KEYLT_LIB_DIR: ${{ env.WS }}/stage/lib
          KEYLT_INCLUDE_DIR: ${{ env.WS }}/stage/include
        run: |
          set -euo pipefail
          sudo apt-get install -y libclang-dev
          export LD_LIBRARY_PATH="${WS}/stage/lib${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"
          cargo test --workspace --no-default-features --features bindgen

      - name: Package
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          mkdir -p dist

          # Archives contain the install tree at their root (include/, lib/,
          # bin/, share/keylt/), so consumers can point CMAKE_PREFIX_PATH at the
          # extracted directory and nothing else.
          if [ "${RUNNER_OS}" = "Windows" ]; then
            archive="keylt-${TARGET}.zip"
            (cd stage && cmake -E tar cf "../dist/${archive}" --format=zip .)
          else
            archive="keylt-${TARGET}.tar.gz"
            (cd stage && cmake -E tar czf "../dist/${archive}" .)
          fi

          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$archive" > "${archive}.sha256"
          else
            shasum -a 256 "$archive" > "${archive}.sha256"
          fi
          cat "${archive}.sha256"

      # Artifacts are scoped to the run, so release.yaml can collect every
      # matrix leg with a single merge-multiple download.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: keylt-${{ inputs.target }}
          path: dist/*
          if-no-files-found: error
