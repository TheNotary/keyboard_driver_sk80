Create `src/blink/usb_functions_linux.cpp` — Linux implementation using hidapi:

- `SearchForDevice(vid, pid, target_device_path)` → Use `hid_enumerate()` to find devices by VID/PID, match interface number, call `hid_open_path()`. Return the `hid_device*` cast to `DeviceHandle`.
- `SendBufferToDevice(handle, messages, count, length)` → Loop calling `hid_send_feature_report(dev, messages[i], length)` with a 1ms `usleep()` between sends.
- `SendBufferToDeviceAndGetResp(handle, messages, count, length)` → Call `hid_send_feature_report()` then `hid_get_feature_report()` for each message.
- `ListAvailableKeyboards()` → Use `hid_enumerate(0, 0)`, match against `known_keyboards`, return matches.
- Device close/cleanup via `hid_close()`.

### Byte-Perfect Mapping (Critical)

- `HidD_SetFeature(handle, buffer, 65)` → `hid_send_feature_report(dev, buffer, 65)` — identical semantics, buffer[0] is report ID
- `DeviceIoControl(IOCTL_HID_GET_FEATURE)` → `hid_get_feature_report(dev, buffer, 65)` — buffer[0] must be set to report ID (0x00)
- `Sleep(1)` → `usleep(1000)` (1ms delay between feature reports — critical for device stability)
- Device open: `CreateFile()` → `hid_open_path()`, Device close: `CloseHandle()` → `hid_close()`

