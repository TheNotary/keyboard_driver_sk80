Create `include/main/platform.h` — a compatibility header defining:
- `typedef uint8_t UINT8` (or alias) for Windows compat
- `typedef unsigned char UCHAR`
- `typedef void* DeviceHandle` (replaces `HANDLE` in interfaces)
- On Windows: `#include <windows.h>` and typedef `DeviceHandle = HANDLE`
- On Linux: `#include <cstdint>` and typedef `DeviceHandle = void*` (hidapi device pointer)
- Platform detection via `#ifdef _WIN32` / `#ifdef __linux__`

