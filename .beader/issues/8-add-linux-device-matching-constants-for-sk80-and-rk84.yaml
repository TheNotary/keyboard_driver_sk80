Adapt target_device_path constants for Linux:

- Windows paths look like `\\?\hid#vid_05ac&pid_024f...`
- Linux hidraw paths look like `/dev/hidraw0` — hidapi uses a usage_page/interface_number filter instead
- For SK80/RK84 constants headers, add Linux-appropriate device matching criteria (usage page or interface number rather than a full path string)
- The VID/PID match plus interface number should be sufficient

