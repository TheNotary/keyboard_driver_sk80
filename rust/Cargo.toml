[workspace]
resolver = "2"
members = ["blink-sys", "blink"]

# The Rust crates track the version of the C library they bind. `blink-sys`
# additionally asserts the ABI major version at run time, which is the value
# that actually governs compatibility.
[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.77"
license = "MIT"
repository = "https://github.com/TheNotary/keyboard_driver_sk80"
homepage = "https://github.com/TheNotary/keyboard_driver_sk80"
authors = ["blink contributors"]

[workspace.dependencies]
blink-sys = { path = "blink-sys", version = "0.2.0" }
