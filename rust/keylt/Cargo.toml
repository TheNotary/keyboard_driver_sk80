[package]
name = "keylt"
description = "Safe Rust bindings for controlling RGB mechanical keyboard LEDs and LCD displays (SK80, RK84)"
readme = "README.md"
keywords = ["keyboard", "led", "rgb", "hid", "sk80"]
categories = ["api-bindings", "hardware-support"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
keylt-sys = { workspace = true }

[features]
default = ["vendored"]
vendored = ["keylt-sys/vendored"]
static = ["keylt-sys/static"]
bindgen = ["keylt-sys/bindgen"]

[package.metadata.docs.rs]
no-default-features = true
rustdoc-args = ["--cfg", "docsrs"]
